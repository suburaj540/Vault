name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name it and fingerprint it
        id: pack
        run: |
          NAME="personal-document-vault-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "sha=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.name }}
          body: |
            Download the APK below and install it on any Android 10 or newer phone.

            Verify what you downloaded before installing:

            SHA-256: `${{ steps.pack.outputs.sha }}`

            Built by GitHub Actions from the source in this repository. The build
            log is public, so you can check that the APK came from this code.

      - name: Also keep it as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.pack.outputs.name }}
