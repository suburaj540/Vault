# One-time helper: creates your app's signing key in the cloud, so you
# never need to install Java on your own computer.
name: Generate Signing Key
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create a random password and the key
        run: |
          PW=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          keytool -genkeypair -v \
            -keystore vault-release.jks \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -alias vault \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Shubham Raj, OU=Personal, O=Personal, L=Pune, ST=Maharashtra, C=IN" \
            -noprompt
          base64 -w0 vault-release.jks > keystore-base64.txt
          echo "$PW" > keystore-password.txt
          echo "vault" > keystore-alias.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            vault-release.jks
            keystore-base64.txt
            keystore-password.txt
            keystore-alias.txt
